<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FloodAI – Real-Time Disaster Response</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="styles.css"></head><body>
<header><div><b>🌊 FloodAI</b><span> Real-Time AI Disaster Response</span></div><div id="connection">Checking backend...</div></header>
<main><section id="auth" class="card auth"><h1>Emergency Response Portal</h1><p>Create an account or login to report emergencies.</p><div class="tabs"><button onclick="showAuth('login')">Login</button><button onclick="showAuth('register')">Register</button></div><form id="authForm"><input id="name" placeholder="Name" hidden><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button>Continue</button></form><small id="authMsg"></small></section>
<section id="app" hidden><div class="topbar"><div><b id="welcome"></b><span id="roleBadge" class="badge"></span></div><button class="secondary" onclick="logout()">Logout</button></div>
<div id="userView"><div class="grid"><div class="card"><h2>🚨 Report Emergency</h2><form id="emergencyForm"><textarea id="message" placeholder="Example: Veetukulla water vandhuduchu, 4 people irukom. Rescue venum..." required></textarea><select id="language"><option value="auto">Tamil / Tanglish / English</option><option value="ta">Tamil</option><option value="en">English</option><option value="tanglish">Tanglish</option></select><div class="row"><input id="lat" placeholder="Latitude"><input id="lng" placeholder="Longitude"></div><input id="address" placeholder="Location / landmark"><input id="image" type="file" accept="image/*"><button>Analyze with Real AI & Submit</button></form><small id="caseMsg"></small></div><div class="card"><h2>📍 Current Location</h2><button onclick="getLocation()">Use My Current Location</button><div id="map"></div></div></div><div class="card"><h2>My Emergency Cases</h2><div id="myCases"></div></div><div class="card"><h2>👤 Report Missing Person</h2><form id="missingForm"><input id="mname" placeholder="Name" required><input id="mage" type="number" placeholder="Age"><input id="mdesc" placeholder="Description"><input id="maddress" placeholder="Last seen location"><div class="row"><input id="mlat" placeholder="Latitude"><input id="mlng" placeholder="Longitude"></div><input id="mphoto" type="file" accept="image/*"><button>Submit Missing Person Report</button></form><div id="myMissing"></div></div></div>
<div id="adminView" hidden><div class="stats" id="stats"></div><div class="grid"><div class="card"><h2>🚨 Live Emergency Cases</h2><div id="adminCases"></div></div><div class="card"><h2>🤝 Rescue Volunteers</h2><form id="volForm"><input id="vname" placeholder="Name" required><input id="vphone" placeholder="Phone"><input id="vteam" placeholder="Team"><input id="vskills" placeholder="Skills (comma separated)"><button>Add Volunteer</button></form><div id="volunteers"></div></div></div><div class="card"><h2>👤 Missing Person Management</h2><div id="adminMissing"></div></div></div>
</section></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script><script src="app.js"></script></body></html>
